<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabungan Bank</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#0b0c10;
  --card:#15161b;
  --card2:#1f2028;
  --txt:#f4f5f7;
  --mut:#b7bcc6;
  --line:rgba(255,255,255,.12);
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --r:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(180deg,#0f1020,#05060a);
  color:var(--txt);
}
button{touch-action:manipulation}

header{
  position:sticky;top:0;z-index:10;
  background:#0b0c10cc;
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1000px;margin:auto;padding:16px}
.brand{font-weight:900}
.muted{color:var(--mut);font-size:12px}

.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px;
  margin-bottom:12px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr}}

.big{font-size:26px;font-weight:900}

input,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#ffffff10;
  color:var(--txt);
}
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:0;
  font-weight:900;
  cursor:pointer;
}
.btn{background:#ffffff15;color:var(--txt)}
.btn-in{background:var(--green);color:#07140c}
.btn-out{background:var(--red);color:#1b070a}
button[disabled]{opacity:.5}

table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);font-size:14px}

.chartWrap{height:240px}
@media(max-width:600px){.chartWrap{height:200px}}

.flash{margin-top:10px;padding:10px;border-radius:12px;background:#3b82f622}
.danger{margin-top:10px;padding:10px;border-radius:12px;background:#ef444422}
</style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="brand">🏦 Tabungan</div>
    <div id="who" class="muted"></div>
  </div>
</header>

<div class="wrap">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>Login / Daftar</h3>
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <div class="grid">
    <button id="btnDaftar" class="btn">Daftar</button>
    <button id="btnLogin" class="btn">Login</button>
  </div>
  <div id="msg" class="flash" style="display:none"></div>
</div>

<!-- APP -->
<div id="appBox" style="display:none">

  <div class="grid3">
    <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
    <div class="card"><div class="muted">Masuk</div><div id="masuk" class="big">Rp 0</div></div>
    <div class="card"><div class="muted">Keluar</div><div id="keluar" class="big">Rp 0</div></div>
  </div>

  <div class="grid">
    <button id="btnMasuk" class="btn-in">+ Uang Masuk</button>
    <button id="btnKeluar" class="btn-out">- Uang Keluar</button>
  </div>

  <div class="card">
    <select id="jenis">
      <option>Uang Masuk</option>
      <option>Uang Keluar</option>
    </select>
    <input id="jumlah" type="number" placeholder="jumlah">
    <input id="catatan" placeholder="catatan">
    <button id="btnSimpan" class="btn">Simpan</button>
    <div id="msg2" class="flash" style="display:none"></div>
    <div id="msgErr" class="danger" style="display:none"></div>
  </div>

  <div class="card">
    <h3>Grafik Saldo (Trading)</h3>
    <div class="chartWrap"><canvas id="chartTrading"></canvas></div>
  </div>

  <div class="card">
    <h3>Riwayat</h3>
    <table>
      <thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

</div>
</div>

<script>
const SUPABASE_URL = "https://hcfoqyekemhwnbbwdvae.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZm9xeWVrZW1od25iYndkdmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2NzA4NjIsImV4cCI6MjA4MzI0Njg2Mn0.S_kSysDrO_TfwUa4uOk-lUrW_OBf4tV6QJPsCO0iS0Y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id=>document.getElementById(id);
const rupiah = n=>"Rp "+Number(n||0).toLocaleString("id-ID");
const today = ()=>new Date().toISOString().slice(0,10);

let cacheRows=[], chart=null;

function show(el,t){el.style.display=t?"block":"none";el.textContent=t||""}

async function register(){
  show($("msg"),"Mendaftar...");
  const {error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});
  show($("msg"), error?error.message:"Daftar berhasil, silakan login");
}
async function loginUser(){
  show($("msg"),"Login...");
  const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(error) show($("msg"),error.message); else start();
}

async function start(){
  $("loginBox").style.display="none";
  $("appBox").style.display="block";
  const {data:{user}}=await sb.auth.getUser();
  $("who").textContent=user.email;
  loadData();
}

function buildSaldoSeries(rows){
  let saldo=0;
  return [...rows].reverse().map(r=>{
    saldo += r.jenis==="Uang Masuk"?Number(r.jumlah):-Number(r.jumlah);
    return {x:r.tanggal,y:saldo};
  });
}

function renderChart(rows){
  const ctx=$("chartTrading");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:"line",
    data:{datasets:[{data:buildSaldoSeries(rows),borderColor:"#3b82f6",backgroundColor:"#3b82f633",fill:true,pointRadius:0,tension:.35}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false}
  });
}

async function loadData(){
  const {data:{user}}=await sb.auth.getUser();
  const {data}=await sb.from("transaksi").select("*").eq("user_id",user.id).order("tanggal",{ascending:false});
  cacheRows=data||[];

  let m=0,k=0;
  cacheRows.forEach(d=>d.jenis==="Uang Masuk"?m+=+d.jumlah:k+=+d.jumlah);
  $("saldo").textContent=rupiah(m-k);
  $("masuk").textContent=rupiah(m);
  $("keluar").textContent=rupiah(k);

  $("list").innerHTML="";
  cacheRows.forEach(d=>$("list").innerHTML+=`<tr><td>${d.tanggal}</td><td>${d.jenis}</td><td>${rupiah(d.jumlah)}</td></tr>`);

  renderChart(cacheRows);
}

async function add(){
  const {data:{user}}=await sb.auth.getUser();
  const j=+$("jumlah").value;
  if($("jenis").value==="Uang Keluar"){
    let saldo=cacheRows.reduce((s,r)=>s+(r.jenis==="Uang Masuk"?+r.jumlah:-r.jumlah),0);
    if(j>saldo){show($("msgErr"),"Saldo tidak cukup");return;}
  }
  await sb.from("transaksi").insert([{user_id:user.id,tanggal:today(),jenis:$("jenis").value,jumlah:j,catatan:$("catatan").value}]);
  $("jumlah").value="";$("catatan").value="";
  loadData();
}

function bind(id,fn){
  const e=$(id);
  e.addEventListener("click",fn);
  e.addEventListener("touchend",fn);
}
document.addEventListener("DOMContentLoaded",()=>{
  bind("btnDaftar",register);
  bind("btnLogin",loginUser);
  bind("btnSimpan",add);
  bind("btnMasuk",()=>{$("jenis").value="Uang Masuk"});
  bind("btnKeluar",()=>{$("jenis").value="Uang Keluar"});
});
sb.auth.getSession().then(r=>r.data.session&&start());
</script>
</body>
</html>
