<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabungan • Candlestick Final</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- Candlestick -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@3"></script>

<!-- Zoom -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>

<style>
:root{
  --bg:#0b0c10;--card:#15161b;--card2:#1f2028;
  --txt:#f4f5f7;--mut:#b7bcc6;--line:rgba(255,255,255,.12);
  --green:#22c55e;--red:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#0f1020,#05060a);color:var(--txt)}
header{position:sticky;top:0;background:#0b0c10cc;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr}}
.big{font-size:26px;font-weight:900}
input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#ffffff10;color:white}
button{border:0;font-weight:900;cursor:pointer}
.btn{background:#ffffff15}
.btn-in{background:var(--green);color:#07140c}
.btn-out{background:var(--red);color:#1b070a}
.chartWrap{height:320px}
@media(max-width:600px){.chartWrap{height:240px}}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line)}
.muted{color:var(--mut);font-size:12px}
</style>
</head>

<body>
<header>
<div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
  <div>
    <b>🏦 Tabungan Candlestick</b>
    <div id="who" class="muted"></div>
  </div>
  <button id="btnLogout" class="btn" style="display:none">Logout</button>
</div>
</header>

<div class="wrap">

<div id="loginBox" class="card">
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <div class="grid">
    <button onclick="daftar()" class="btn">Daftar</button>
    <button onclick="login()" class="btn">Login</button>
  </div>
  <div id="msg" class="muted"></div>
</div>

<div id="app" style="display:none">

<div class="grid3">
  <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
  <div class="card"><div class="muted">Masuk</div><div id="masuk" class="big">Rp 0</div></div>
  <div class="card"><div class="muted">Keluar</div><div id="keluar" class="big">Rp 0</div></div>
</div>

<div class="grid">
  <button class="btn-in" onclick="setJenis('Uang Masuk')">+ Uang Masuk</button>
  <button class="btn-out" onclick="setJenis('Uang Keluar')">- Uang Keluar</button>
</div>

<div class="card">
  <select id="jenis">
    <option>Uang Masuk</option>
    <option>Uang Keluar</option>
  </select>
  <input id="jumlah" type="number" placeholder="jumlah">
  <button onclick="simpan()" class="btn">Simpan</button>
  <div id="err" class="muted"></div>
</div>

<div class="card">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <select id="mode">
      <option value="all">Semua</option>
      <option value="masuk">Uang Masuk</option>
      <option value="keluar">Uang Keluar</option>
    </select>
    <select id="range">
      <option value="30s">30 detik</option>
      <option value="15m" selected>15 menit</option>
      <option value="1d">1 hari</option>
      <option value="all">Semua</option>
    </select>
    <button onclick="cek()" class="btn">Cek Data Waktu</button>
  </div>

  <div class="chartWrap"><canvas id="chart"></canvas></div>
  <div id="hint" class="muted"></div>
</div>

<div class="card">
  <table>
    <thead><tr><th>Waktu</th><th>Jenis</th><th>Jumlah</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

</div>
</div>

<script>
const sb = supabase.createClient(
 "https://hcfoqyekemhwnbbwdvae.supabase.co",
 "PASTE_ANON_KEY_KAMU"
);

let rows=[], chart, jenisNow="Uang Masuk";
const $=id=>document.getElementById(id);
const rp=n=>"Rp "+Number(n).toLocaleString("id-ID");

Chart.register(...Chart.registerables);
Chart.register(window.ChartZoom);

function ts(r){return Date.parse(r.waktu||r.tanggal);}
function rangeMs(r){return r=="30s"?3e4:r=="15m"?9e5:r=="1d"?864e5:null}

async function daftar(){
  const {error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});
  $("msg").innerText=error?error.message:"Daftar berhasil";
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(!error) start();
}
async function start(){
  $("loginBox").style.display="none";
  $("app").style.display="block";
  $("btnLogout").style.display="block";
  $("btnLogout").onclick=async()=>{await sb.auth.signOut();location.reload();}
  const {data:{user}}=await sb.auth.getUser();
  $("who").innerText=user.email;
  load();
}

function setJenis(j){$("jenis").value=j}

async function load(){
 const {data:{user}}=await sb.auth.getUser();
 const r=await sb.from("transaksi").select("*").eq("user_id",user.id).order("waktu",{ascending:true});
 rows=r.data||[];
 let m=0,k=0;
 rows.forEach(x=>x.jenis=="Uang Masuk"?m+=+x.jumlah:k+=+x.jumlah);
 $("saldo").innerText=rp(m-k);
 $("masuk").innerText=rp(m);
 $("keluar").innerText=rp(k);
 $("list").innerHTML=rows.map(x=>`<tr><td>${x.waktu}</td><td>${x.jenis}</td><td>${rp(x.jumlah)}</td></tr>`).join("");
 draw();
}

async function simpan(){
 const j=+$("jumlah").value;
 if(!j)return;
 const saldo=rows.reduce((s,r)=>s+(r.jenis=="Uang Masuk"?+r.jumlah:-r.jumlah),0);
 if($("jenis").value=="Uang Keluar" && j>saldo){$("err").innerText="Saldo kurang";return;}
 const {data:{user}}=await sb.auth.getUser();
 await sb.from("transaksi").insert([{user_id:user.id,waktu:new Date().toISOString(),tanggal:new Date().toISOString(),jenis:$("jenis").value,jumlah:j}]);
 $("jumlah").value="";
 load();
}

function build(){
 let saldo=0,out=[];
 const mode=$("mode").value,rg=$("range").value,now=Date.now(),rm=rangeMs(rg);
 rows.forEach(r=>{
  const o=saldo;
  saldo+=r.jenis=="Uang Masuk"?+r.jumlah:-r.jumlah;
  const c=saldo;
  if((mode=="all"||mode=="masuk"&&r.jenis=="Uang Masuk"||mode=="keluar"&&r.jenis=="Uang Keluar")
     &&(!rm||ts(r)>=now-rm)){
    out.push({x:r.waktu,o,h:Math.max(o,c),l:Math.min(o,c),c});
  }
 });
 return out.slice(-200);
}

function draw(){
 if(chart)chart.destroy();
 const d=build();
 $("hint").innerText=d.length?`Candle: ${d.length}`:"Tidak ada transaksi di range ini";
 chart=new Chart($("chart"),{
  type:"candlestick",
  data:{datasets:[{data:d}]},
  options:{plugins:{legend:{display:false},zoom:{pan:{enabled:true},zoom:{wheel:{enabled:true},pinch:{enabled:true}}}},
  scales:{x:{type:"category"},y:{ticks:{callback:v=>rp(v)}}}}
 );
}

function cek(){
 alert(`Total: ${rows.length}\nPunya waktu: ${rows.filter(r=>r.waktu).length}`);
}

sb.auth.getSession().then(r=>{if(r.data.session)start();});
</script>
</body>
</html>
