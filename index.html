<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabungan • Candlestick</title>

  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://zxfathn.github.io/tabungan-web/style.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Candlestick -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@3"></script>

  <!-- Zoom -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div>
      <div class="brand">🏦 Tabungan Candlestick</div>
      <div id="who" class="muted"></div>
    </div>
    <button id="btnLogout" class="btn" style="display:none;max-width:160px" type="button">Logout</button>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="loginBox" class="card">
    <h3 class="mt0">Login / Daftar</h3>
    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="password" />
    <div class="grid mt10">
      <button id="btnDaftar" class="btn" type="button">Daftar</button>
      <button id="btnLogin" class="btn" type="button">Login</button>
    </div>
    <div id="msg" class="muted mt10"></div>
  </section>

  <!-- APP -->
  <section id="app" style="display:none">
    <div class="grid3">
      <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Masuk</div><div id="masuk" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Keluar</div><div id="keluar" class="big">Rp 0</div></div>
    </div>

    <div class="grid">
      <button id="btnMasuk" class="btn-in" type="button">+ Uang Masuk</button>
      <button id="btnKeluar" class="btn-out" type="button">- Uang Keluar</button>
    </div>

    <div class="card">
      <select id="jenis">
        <option>Uang Masuk</option>
        <option>Uang Keluar</option>
      </select>
      <input id="jumlah" type="number" inputmode="numeric" placeholder="jumlah" class="mt10" />
      <input id="catatan" placeholder="catatan (opsional)" class="mt10" />
      <button id="btnSimpan" class="btn mt10" type="button">Simpan</button>
      <div id="err" class="muted mt8"></div>
    </div>

    <div class="card">
      <div class="chartHead">
        <h3 class="mt0">Candlestick (1 transaksi = 1 candle)</h3>
        <div class="controls">
          <select id="mode" style="max-width:200px">
            <option value="all" selected>Semua</option>
            <option value="masuk">Uang Masuk</option>
            <option value="keluar">Uang Keluar</option>
          </select>

          <select id="range" style="max-width:200px">
            <option value="30s">Range: 30 detik</option>
            <option value="15m" selected>Range: 15 menit</option>
            <option value="1d">Range: 1 hari</option>
            <option value="all">Range: Semua</option>
          </select>

          <button id="btnCek" class="btn" type="button" style="max-width:200px">Cek Data Waktu</button>
        </div>
      </div>

      <div class="chartWrap">
        <canvas id="chart"></canvas>
      </div>

      <div class="muted">Zoom: pinch (HP) / scroll (laptop). Geser: drag.</div>
      <div id="hint" class="muted mt8"></div>
    </div>

    <div class="card">
      <h3 class="mt0">Riwayat</h3>
      <table>
        <thead><tr><th>Waktu</th><th>Jenis</th><th>Jumlah</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://zxfathn.github.io/tabungan-web/app.js"></script>
</body>
</html>
