<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabungan Online</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{margin:0;font-family:Arial;background:#f5f6fa}
    header{background:#111;color:#fff;padding:14px}
    .wrap{max-width:900px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 5px 15px rgba(0,0,0,.08)}
    .big{font-size:24px;font-weight:bold}
    .muted{color:#666;font-size:12px}
    input,select,button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ddd}
    button{cursor:pointer;font-weight:bold}
    .btn{background:#e5e7eb;border:none}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eee;padding:8px;font-size:14px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <b>💰 Tabungan Online</b>
    <div class="muted">Gratis • Multi User • Supabase</div>
  </div>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h3>Login / Daftar</h3>
    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password (min 6)">
    <div class="grid">
      <button class="btn" id="btnDaftar" type="button">Daftar</button>
      <button class="btn" id="btnLogin" type="button">Login</button>
    </div>
    <div id="msg" class="muted"></div>
  </div>

  <!-- APP -->
  <div id="appBox" style="display:none">

    <div class="grid">
      <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Total Masuk</div><div id="masuk" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Total Keluar</div><div id="keluar" class="big">Rp 0</div></div>
    </div>

    <div class="card">
      <h3>Tambah Transaksi</h3>
      <select id="jenis">
        <option>Uang Masuk</option>
        <option>Uang Keluar</option>
      </select>
      <input id="jumlah" type="number" placeholder="contoh: 1000000">
      <input id="catatan" placeholder="catatan">
      <button class="btn" id="btnSimpan" type="button">Simpan</button>
      <div id="msg2" class="muted"></div>
    </div>

    <div class="card">
      <h3>Riwayat</h3>
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <button class="btn" id="btnLogout" type="button">Logout</button>
  </div>
</div>

<script>
/* ========= SUPABASE CONFIG (SUDAH DIISI) ========= */
const SUPABASE_URL = "https://hcfoqyekemhwnbbwdvae.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjZm9xeWVrZW1od25iYndkdmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2NzA4NjIsImV4cCI6MjA4MzI0Njg2Mn0.S_kSysDrO_TfwUa4uOk-lUrW_OBf4tV6QJPsCO0iS0Y";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========= HELPER ========= */
const $ = (id) => document.getElementById(id);
function rupiah(n){ return "Rp " + Number(n||0).toLocaleString("id-ID"); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ========= AUTH ========= */
async function register(){
  const email = $("email").value.trim();
  const password = $("password").value;

  $("msg").textContent = "Mendaftar...";

  const { error } = await sb.auth.signUp({ email, password });
  $("msg").textContent = error ? ("Gagal daftar: " + error.message)
                              : "Daftar berhasil. Sekarang klik Login.";
}

async function loginUser(){
  const email = $("email").value.trim();
  const password = $("password").value;

  $("msg").textContent = "Login...";

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) $("msg").textContent = "Gagal login: " + error.message;
  else start();
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ========= APP ========= */
async function start(){
  $("loginBox").style.display = "none";
  $("appBox").style.display = "block";
  loadData();
}

async function loadData(){
  $("msg2").textContent = "Memuat...";
  const { data, error } = await sb.from("transaksi").select("*").order("tanggal",{ascending:false});
  if(error){ $("msg2").textContent = error.message; return; }

  let masuk=0, keluar=0;
  $("list").innerHTML = "";

  (data||[]).forEach(d=>{
    if(d.jenis==="Uang Masuk") masuk+=Number(d.jumlah);
    else keluar+=Number(d.jumlah);

    $("list").innerHTML += `
      <tr>
        <td>${d.tanggal}</td>
        <td>${d.jenis}</td>
        <td>${rupiah(d.jumlah)}</td>
      </tr>`;
  });

  $("saldo").textContent  = rupiah(masuk-keluar);
  $("masuk").textContent  = rupiah(masuk);
  $("keluar").textContent = rupiah(keluar);
  $("msg2").textContent = "";
}

async function add(){
  const { data:{user} } = await sb.auth.getUser();
  if(!user){ $("msg2").textContent="Belum login"; return; }

  const jenis = $("jenis").value;
  const jumlah = Number($("jumlah").value);
  const catatan = $("catatan").value || "";

  if(!jumlah || jumlah<=0){ $("msg2").textContent="Jumlah salah"; return; }

  const { error } = await sb.from("transaksi").insert([{
    user_id:user.id,
    tanggal:today(),
    jenis, jumlah, catatan
  }]);

  if(error){ $("msg2").textContent=error.message; return; }

  $("jumlah").value="";
  $("catatan").value="";
  loadData();
}

/* ========= EVENT ========= */
$("btnDaftar").onclick = register;
$("btnLogin").onclick  = loginUser;
$("btnSimpan").onclick = add;
$("btnLogout").onclick = logout;

/* ========= AUTO LOGIN ========= */
sb.auth.getSession().then(r=>{
  if(r.data.session) start();
});
</script>

</body>
</html>
