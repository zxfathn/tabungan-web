<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabungan • Grafik</title>

  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://zxfathn.github.io/tabungan-web/style.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js LINE (AMAN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div>
      <div class="brand">🏦 Tabungan</div>
      <div id="who" class="muted"></div>
    </div>
    <button id="btnLogout" class="btn" style="display:none;max-width:160px">Logout</button>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="loginBox" class="card">
    <h3>Login / Daftar</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <div class="grid">
      <button id="btnDaftar" class="btn">Daftar</button>
      <button id="btnLogin" class="btn">Login</button>
    </div>
    <div id="msg" class="muted"></div>
  </section>

  <!-- APP -->
  <section id="app" style="display:none">
    <div class="grid3">
      <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Masuk</div><div id="masuk" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Keluar</div><div id="keluar" class="big">Rp 0</div></div>
    </div>

    <div class="grid">
      <button id="btnMasuk" class="btn-in">+ Uang Masuk</button>
      <button id="btnKeluar" class="btn-out">- Uang Keluar</button>
    </div>

    <div class="card">
      <select id="jenis">
        <option>Uang Masuk</option>
        <option>Uang Keluar</option>
      </select>
      <input id="jumlah" type="number" placeholder="Jumlah">
      <button id="btnSimpan" class="btn">Simpan</button>
      <div id="err" class="muted"></div>
    </div>

    <div class="card">
      <h3>Grafik Saldo</h3>
      <select id="range">
        <option value="all">Semua</option>
        <option value="30s">30 Detik</option>
        <option value="15m">15 Menit</option>
        <option value="1d">1 Hari</option>
      </select>
      <div class="chartWrap">
        <canvas id="chart"></canvas>
      </div>
      <div id="hint" class="muted"></div>
    </div>
  </section>
</main>

<script src="https://zxfathn.github.io/tabungan-web/app.js"></script>
</body>
</html>
