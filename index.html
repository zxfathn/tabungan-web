<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabungan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://zxfathn.github.io/tabungan-web/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div>
      <div class="brand">🏦 Tabungan</div>
      <div id="who" class="muted"></div>
    </div>

    <!-- MENU GARIS -->
    <div class="menuWrap">
      <button id="btnMenu" class="menuBtn" type="button">☰</button>

      <div id="menuDrop" class="menuDrop">
        <div class="menuProfile">
          <img id="avatar" alt="avatar">
          <div>
            <div id="profileName" class="profileName"></div>
            <div id="profileEmail" class="muted"></div>
          </div>
        </div>

        <input type="file" id="photo" accept="image/*">
        <button id="btnLogout" class="menuLogout" type="button">🚪 Logout</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="loginBox" class="card">
    <h3 class="mt0">Login / Daftar</h3>
    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password">
    <div class="grid mt10">
      <button id="btnDaftar" class="btn" type="button">Daftar</button>
      <button id="btnLogin" class="btn" type="button">Login</button>
    </div>
    <div id="msg" class="muted mt10"></div>
  </section>

  <!-- APP -->
  <section id="app" style="display:none">
    <div class="grid3">
      <div class="card"><div class="muted">Saldo</div><div id="saldo" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Masuk</div><div id="masuk" class="big">Rp 0</div></div>
      <div class="card"><div class="muted">Keluar</div><div id="keluar" class="big">Rp 0</div></div>
    </div>

    <div class="grid">
      <button id="btnMasuk" class="btn-in" type="button">+ Uang Masuk</button>
      <button id="btnKeluar" class="btn-out" type="button">- Uang Keluar</button>
    </div>

    <div class="card">
      <select id="jenis">
        <option>Uang Masuk</option>
        <option>Uang Keluar</option>
      </select>
      <input id="jumlah" type="number" placeholder="jumlah" class="mt10">
      <input id="catatan" placeholder="catatan (opsional)" class="mt10">
      <button id="btnSimpan" class="btn mt10" type="button">Simpan</button>
      <div id="err" class="muted mt8"></div>
    </div>

    <div class="card">
      <div class="chartWrap"><canvas id="chart"></canvas></div>
    </div>

    <div class="card">
      <h3 class="mt0">Riwayat</h3>
      <table>
        <thead><tr><th>Waktu</th><th>Jenis</th><th>Jumlah</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://zxfathn.github.io/tabungan-web/app.js"></script>
</body>
</html>
